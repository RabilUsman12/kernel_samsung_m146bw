name: Build Bootable GKI Kernel 5.15 (SM-M146B)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space & Swap (10GB for Full LTO)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 device-tree-compiler cpio

      - name: Download Android Clang 14.0.6 (r450784d)
        run: |
          mkdir -p ~/toolchain/clang-r450784d
          cd ~/toolchain/clang-r450784d
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Clone AOSP GKI android13-5.15-lts
        run: |
          git clone --depth=1 -b android13-5.15-lts https://android.googlesource.com/kernel/common ~/kernel
          cd ~/kernel
          head -n 5 Makefile

      - name: Integrate KernelSU (v0.9.5 Stable for 5.15)
        run: |
          cd ~/kernel
          curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Configure Kernel (Full LTO + CFI Permissive + KSU + BBR + 1000Hz)
        run: |
          cd ~/kernel
          export PATH="$HOME/toolchain/clang-r450784d/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make O=out gki_defconfig
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-android13-8-CustomGaming" \
            -d LOCALVERSION_AUTO \
            -d WERROR \
            -d TRIM_UNUSED_KSYMS \
            -d LTO_NONE \
            -d LTO_CLANG_THIN \
            -e LTO \
            -e LTO_CLANG \
            -e LTO_CLANG_FULL \
            -e CFI_CLANG \
            -e CFI_CLANG_SHADOW \
            -e CFI_PERMISSIVE \
            -e SHADOW_CALL_STACK \
            -e MODVERSIONS \
            -e AUDIT \
            -e SECURITY_SELINUX \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            --set-str DEFAULT_TCP_CONG "bbr" \
            -e NET_SCH_FQ_CODEL \
            -e NET_SCH_FQ \
            -e HZ_1000 \
            -d HZ_250 \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          make O=out olddefconfig

      - name: Compile Kernel Image
        run: |
          set -o pipefail
          cd ~/kernel
          export PATH="$HOME/toolchain/clang-r450784d/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make O=out prepare
          make -j$(nproc) O=out security/selinux/
          find out/security/selinux -name "*.h" -exec cp -v {} security/selinux/include/ \; 2>/dev/null || true
          if ! make -j$(nproc) O=out Image 2>&1 | tee ~/build.log; then
            echo "=== EXACT COMPILER ERRORS ==="
            grep -E "error:|undefined reference|ld.lld:" ~/build.log | tail -n 30
            exit 1
          fi

      - name: Package AnyKernel3 GKI Zip (FKM Ready)
        run: |
          mkdir -p ~/out_release
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cp ~/kernel/out/arch/arm64/boot/Image ~/AnyKernel3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/BLOCK=\/dev\/block\/by-name\/boot;/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=0;\nNO_RAMDISK=1;/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/dump_boot;/split_boot;/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' ~/AnyKernel3/anykernel.sh
          cd ~/AnyKernel3
          zip -r9 ~/out_release/FKM_CustomKernel_SM-M146B_5.15_KSU.zip * -x .git README.md *placeholder

      - name: Upload FKM Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: FKM-Flashable-SM-M146B-5.15
          path: ~/out_release/FKM_CustomKernel_SM-M146B_5.15_KSU.zip
