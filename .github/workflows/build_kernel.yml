name: Build Custom GKI Kernel 5.15.197 (SM-M146B)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 device-tree-compiler cpio

      - name: Download Android Clang 14.0.6 (r450784d)
        run: |
          mkdir -p ~/toolchain/clang-r450784d
          cd ~/toolchain/clang-r450784d
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Clone AOSP GKI android13-5.15 (5.15.197)
        run: |
          git clone --depth=1 -b android13-5.15-lts https://android.googlesource.com/kernel/common ~/kernel
          cd ~/kernel
          git fetch --depth=1 origin tag android13-5.15.197_r00 || true
          git checkout FETCH_HEAD || true
          head -n 5 Makefile

      - name: Integrate KernelSU
        run: |
          cd ~/kernel
          if curl -fsSL "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" -o ksu_setup.sh; then
            bash ksu_setup.sh main
          else
            curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          fi
          rm -f ksu_setup.sh

      - name: Apply Gaming, Network (BBR), 1000Hz & Debloat Configs
        run: |
          cd ~/kernel
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig

          # KernelSU
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y

          # 1000Hz Low-Latency Timer & Preemption
          # CONFIG_HZ_250 is not set
          CONFIG_HZ_1000=y
          CONFIG_HZ=1000

          # TCP BBR & Network Gaming Optimization
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_FQ=y

          # Disable Heavy Debugging & Security Overhead
          # CONFIG_DEBUG_KERNEL is not set
          # CONFIG_FTRACE is not set
          # CONFIG_SCHED_DEBUG is not set
          # CONFIG_AUDIT is not set
          # CONFIG_SECURITY_DEFEX is not set
          # CONFIG_PROCA is not set
          # CONFIG_FIVE is not set
          EOF

      - name: Compile Kernel Image
        run: |
          cd ~/kernel
          export PATH="$HOME/toolchain/clang-r450784d/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          make O=out gki_defconfig
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-android13-3-31192385-CustomGaming" \
            -d LOCALVERSION_AUTO \
            -e KSU \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e HZ_1000 \
            -d HZ_250 \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT

          make O=out olddefconfig
          make -j$(nproc) O=out Image

      - name: Package AnyKernel3 Flashable Zip & Raw Image
        run: |
          mkdir -p ~/out_release
          cp ~/kernel/out/arch/arm64/boot/Image ~/out_release/Image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cp ~/kernel/out/arch/arm64/boot/Image ~/AnyKernel3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/BLOCK=\/dev\/block\/by-name\/boot;/g' ~/AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=0;/g' ~/AnyKernel3/anykernel.sh
          cd ~/AnyKernel3
          zip -r9 ~/out_release/CustomKernel_SM-M146B_5.15.197_KSU.zip * -x .git README.md *placeholder

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-M146B-Custom-Kernel-5.15.197
          path: ~/out_release/
