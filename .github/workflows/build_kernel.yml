name: Build Custom Kernel SM-M146B (Exynos 1330)

on:
  workflow_dispatch:

jobs:
  inspect-and-setup:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 device-tree-compiler

      - name: Clone Exynos 1330 (s5e8535 / m14x) Kernel Source
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git ~/kernel
          cd ~/kernel
          git branch -a
          ls -la

      - name: Inspect Defconfig, DTSI & Thermal Drivers
        run: |
          cd ~/kernel
          echo "=== DEFCONFIGS ==="
          find arch/arm64/configs -name "*s5e8535*" -o -name "*m14x*" -o -name "*exynos*"
          echo "=== DEVICE TREES (OPP Tables) ==="
          find arch/arm64/boot/dts -name "*s5e8535*" -o -name "*m14x*"
          echo "=== THERMAL & GPU DRIVERS ==="
          find drivers/thermal -maxdepth 2
          find drivers/gpu/arm -maxdepth 2
