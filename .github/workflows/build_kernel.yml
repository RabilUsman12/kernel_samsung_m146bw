name: Build Custom Kernel SM-M146B (Exynos 1330)

on:
  workflow_dispatch:

jobs:
  inspect-build-system:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/devhunter1/android_kernel_samsung_s5e8535.git ~/kernel

      - name: Check Build Scripts, Defconfig & ECT/OPP Tables
        run: |
          cd ~/kernel
          echo "=== ROOT BUILD SCRIPTS ==="
          ls -la build* *.sh 2>/dev/null || true
          cat build_kernel.sh 2>/dev/null || true
          echo "=== M14X DEFCONFIG HIGHLIGHTS ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_UH|CONFIG_RKP|CONFIG_KDP|CONFIG_SECURITY_DEFEX|CONFIG_PROCA|CONFIG_FIVE|CONFIG_TCP_CONG|CONFIG_MALI|CONFIG_EXYNOS_THERMAL|CONFIG_EXYNOS_UFCC|CONFIG_TRIM_UNUSED_KSYMS|CONFIG_MODVERSIONS" arch/arm64/configs/m14x_defconfig || true
          echo "=== DTSI / OPP / ECT FILES ==="
          find arch/arm64/boot/dts -name "*s5e8535*" -o -name "*8535*" -o -name "*m14x*"
          echo "=== EXYNOS THERMAL & MALI PLATFORM ==="
          ls -la drivers/gpu/arm/exynos/platform/ 2>/dev/null || find drivers/gpu/arm/exynos -maxdepth 3
